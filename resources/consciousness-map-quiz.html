                                    { lvl: "Neutrality (250)", cat: "Daya (Power)", cl: "bg-cyan-50 text-cyan-900 border-l-4 border-cyan-500" },
                                    { lvl: "Courage (200)", cat: "Daya (Power)", cl: "bg-blue-50 text-blue-900 border-l-4 border-blue-500" },
                                    { lvl: "Pride (175)", cat: "Paksaan (Force)", cl: "bg-indigo-50 text-indigo-900 border-l-4 border-indigo-500" },
                                    { lvl: "Anger (150)", cat: "Paksaan (Force)", cl: "bg-red-50 text-red-900 border-l-4 border-red-500" },
                                    { lvl: "Desire (125)", cat: "Paksaan (Force)", cl: "bg-orange-50 text-orange-900 border-l-4 border-orange-500" },
                                    { lvl: "Fear (100)", cat: "Paksaan (Force)", cl: "bg-orange-100 text-orange-900 border-l-4 border-orange-600" },
                                    { lvl: "Grief (75)", cat: "Paksaan (Force)", cl: "bg-slate-100 text-slate-900 border-l-4 border-slate-500" },
                                    { lvl: "Apathy (50)", cat: "Paksaan (Force)", cl: "bg-gray-100 text-gray-900 border-l-4 border-gray-500" },
                                    { lvl: "Guilt (30)", cat: "Paksaan (Force)", cl: "bg-gray-200 text-gray-900 border-l-4 border-gray-600" },
                                    { lvl: "Shame (20)", cat: "Paksaan (Force)", cl: "bg-gray-300 text-gray-900 border-l-4 border-gray-700" }
                                ].map((item, idx) => (
                                    <div key={idx} className={`flex justify-between items-center p-4 rounded-r-2xl ${item.cl} font-medium text-sm`}>
                                        <span>{item.lvl}</span>
                                        <span className="opacity-70 text-[10px] uppercase tracking-widest font-bold">{item.cat}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col bg-cream">
                    {/* Sticky Navigation matching main site */}
                    <nav className="nav-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
                        <a href="/" className="text-charcoal serif font-bold text-lg tracking-tight hover:text-earth transition">Wahyu Teguh A.</a>
                        <div className="flex items-center gap-4">
                            <a href="/#resources" className="text-[10px] font-bold uppercase tracking-widest text-stone hover:text-charcoal transition">Resources</a>
                        </div>
                    </nav>

                    <main className="flex-1 flex flex-col items-center py-12 px-6">
                        {!hasStarted ? (
                            <div className="bg-white rounded-[2.5rem] shadow-sm border border-cream-dark p-8 md:p-16 max-w-3xl w-full text-center animate-fadeIn">
                                <span className="text-[10px] font-bold text-earth uppercase tracking-[0.3em] mb-4 block">Self-Discovery Tool</span>
                                <h1 className="text-5xl font-bold text-charcoal serif mb-8">Consciousness Map Quiz</h1>
                                <p className="text-stone mb-12 leading-relaxed text-lg italic">
                                    "Your level of consciousness determines your reality."
                                </p>
                                <p className="text-charcoal-mid mb-12 leading-relaxed max-w-xl mx-auto">
                                    Berdasarkan riset Dr. David R. Hawkins, temukan tingkat energi dominan Anda saat ini dan bagaimana hal itu membentuk cara Anda melihat dunia.
                                </p>
                                
                                <div className="bg-cream-dark/30 border border-cream-dark text-charcoal-mid rounded-[2rem] p-8 mb-12 text-sm text-left shadow-inner">
                                    <span className="font-bold flex items-center mb-4 text-charcoal serif text-lg">
                                        <Info className="w-6 h-6 mr-3 text-earth" />
                                        Catatan Penting
                                    </span>
                                    <p className="leading-relaxed">
                                        Peta Kesadaran bersifat dinamis. Anda bisa berada di level 400 (Rasio) dalam pekerjaan, namun turun ke level 150 (Marah) dalam hubungan asmara. Hasil skor kuis ini hanyalah refleksi dari pola dominan Anda dan bukan diagnosis psikologis mutlak.
                                    </p>
                                </div>

                                <button 
                                    onClick={() => setHasStarted(true)}
                                    className="bg-charcoal hover:bg-earth text-cream font-bold py-5 px-12 rounded-full transition-all duration-300 shadow-xl hover:shadow-2xl transform hover:-translate-y-1 w-full sm:w-auto uppercase text-xs tracking-widest">
                                    Mulai Kuis
                                </button>
                            </div>
                        ) : isFinished ? (
                            <div className="bg-white rounded-[2.5rem] shadow-sm border border-cream-dark p-8 md:p-16 max-w-3xl w-full text-center animate-fadeIn">
                                <h2 className="text-4xl font-bold mb-4 text-charcoal serif">Hasil Analisis Anda</h2>
                                <div className="mb-12">
                                    <span className="text-[10px] font-bold text-stone uppercase tracking-widest">Estimasi Skor Kesadaran</span>
                                    <div className="text-6xl font-bold text-charcoal mt-2">{Math.round(answers.reduce((a, b) => a + b, 0) / answers.length)}</div>
                                </div>
                                
                                {(() => {
                                    const avg = Math.round(answers.reduce((a, b) => a + b, 0) / answers.length);
                                    const result = analyzeHawkinsLevel(avg);
                                    return (
                                        <div className={`${result.bg} rounded-[2rem] p-10 mb-12 border ${result.borderColor} animate-slideUp text-left`}>
                                            <h3 className={`text-3xl font-bold ${result.color} serif mb-2`}>{result.level}</h3>
                                            <h4 className="text-sm font-bold text-charcoal-mid uppercase tracking-widest mb-6 opacity-70">Emosi Dominan: {result.emotion}</h4>
                                            <p className="text-charcoal leading-relaxed text-lg italic serif">"{result.desc}"</p>
                                        </div>
                                    );
                                })()}

                                <p className="text-xs text-stone italic mb-12 px-4 max-w-lg mx-auto leading-relaxed">
                                    Ingat: Tingkat kesadaran bisa berfluktuasi. Jadikan ini sebagai alat navigasi diri untuk bertumbuh ke arah 'Daya' (Power) daripada 'Paksaan' (Force).
                                </p>

                                <div className="flex flex-col sm:flex-row justify-center gap-6">
                                    <button 
                                        onClick={() => setShowMap(true)}
                                        className="bg-white border border-charcoal hover:bg-charcoal hover:text-cream text-charcoal font-bold py-4 px-10 rounded-full transition-all duration-300 flex items-center justify-center gap-3 text-xs uppercase tracking-widest">
                                        <Map size={18} /> Lihat Peta Full
                                    </button>
                                    <button 
                                        onClick={resetQuiz}
                                        className="bg-charcoal hover:bg-earth text-cream font-bold py-4 px-10 rounded-full transition-all duration-300 flex items-center justify-center gap-3 text-xs uppercase tracking-widest shadow-lg">
                                        <RotateCcw size={18} /> Ulangi Kuis
                                    </button>
                                </div>

                                {showMap && <FullMapModal />}
                            </div>
                        ) : (
                            <div className="bg-white rounded-[2.5rem] shadow-sm border border-cream-dark p-8 md:p-16 max-w-3xl w-full animate-fadeIn">
                                <div className="mb-12">
                                    <div className="flex justify-between items-end mb-6">
                                        <div>
                                            <span className="text-[10px] font-bold text-earth uppercase tracking-widest mb-2 block">Consciousness Check</span>
                                            <h2 className="text-sm font-bold text-charcoal uppercase tracking-widest">Pertanyaan {currentQuestion + 1} <span className="text-stone">/ {questions.length}</span></h2>
                                        </div>
                                        <div className="text-xs font-bold text-stone uppercase tracking-widest">
                                            {Math.round(((currentQuestion + 1) / questions.length) * 100)}% Complete
                                        </div>
                                    </div>
                                    <div className="w-full bg-cream-dark h-1.5 rounded-full overflow-hidden">
                                        <div 
                                            className="bg-earth h-full transition-all duration-700 ease-out" 
                                            style={{ width: `${((currentQuestion + 1) / questions.length) * 100}%` }}
                                        ></div>
                                    </div>
                                </div>

                                <h2 className="text-3xl font-bold text-charcoal serif mb-10 leading-snug">
                                    {questions[currentQuestion].question}
                                </h2>

                                <div className="space-y-4">
                                    {questions[currentQuestion].options.map((option, index) => (
                                        <button
                                            key={index}
                                            onClick={() => handleAnswer(option.value)}
                                            className="w-full text-left p-6 rounded-2xl border border-cream-dark hover:border-earth hover:bg-cream transition-all duration-300 group flex items-center justify-between"
                                        >
                                            <div className="flex items-center gap-4">
                                                <div className="w-8 h-8 rounded-full border border-cream-dark group-hover:border-earth bg-white flex items-center justify-center flex-shrink-0 transition-colors">
                                                    <div className="w-2 h-2 rounded-full bg-earth opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                                </div>
                                                <span className="text-charcoal-mid group-hover:text-charcoal font-medium transition-colors">{option.text}</span>
                                            </div>
                                            <ChevronRight size={18} className="text-stone opacity-0 group-hover:opacity-100 transition-all -translate-x-2 group-hover:translate-x-0" />
                                        </button>
                                    ))}
                                </div>

                                {currentQuestion > 0 && (
                                    <div className="mt-12 flex justify-start border-t border-cream-dark pt-8">
                                        <button
                                            onClick={handleBack}
                                            className="text-stone hover:text-charcoal font-bold text-[10px] uppercase tracking-widest flex items-center transition-all group"
                                        >
                                            <ArrowLeft size={16} className="mr-2 transform group-hover:-translate-x-1 transition-transform" />
                                            Kembali
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* FOOTER */}
                    <footer>
                        <p className="footer-name">Wahyu Teguh Arifianto</p>
                        <ul className="footer-links">
                            <li><a href="/#about">About</a></li>
                            <li><a href="/#expertise">Expertise</a></li>
                            <li><a href="/#writing">Writing</a></li>
                            <li><a href="/#resources">Resources</a></li>
                            <li><a href="/#youtube">YouTube</a></li>
                            <li><a href="/#contact">Contact</a></li>
                        </ul>
                        <p className="footer-copy">© 2025 Wahyu Teguh Arifianto · wahyuteguh.com</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
